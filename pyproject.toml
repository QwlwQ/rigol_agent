[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "rigol-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.8,<3", "httpx>=0.27,<1", "PyYAML>=6,<7", "python-dotenv>=1,<2", "numpy>=1.24,<2"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
rigol-agent = "rigol_agent.cli:main"
[tool.setuptools.packages.find]
include = ["rigol_agent*", "task*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
