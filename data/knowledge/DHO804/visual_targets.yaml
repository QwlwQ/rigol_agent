# Semantic visual descriptions for Qwen3-VL.
# These descriptions explain how the logical target appears in the DHO804 UI.
targets:
  CH1:
    visual_description: >-
      Locate the first channel control card in the bottom channel-control strip,
      visibly marked with the number 1. The screen may not contain the text CH1.
  CH2:
    visual_description: >-
      Locate the second channel control card in the bottom channel-control strip,
      visibly marked with the number 2. This card represents logical channel CH2;
      do not require the literal text CH2 or 通道2. The card exists even when
      the channel is off; in the off state it may be dark and there may be no
      CH2 waveform. Use the fixed channel-card slot and the visible number 2,
      not the presence of a waveform, to locate it.
  CH3:
    visual_description: >-
      Locate the third channel control card in the bottom channel-control strip,
      visibly marked with the number 3. This card represents logical channel CH3.
  CH4:
    visual_description: >-
      Locate the fourth channel control card in the bottom channel-control strip,
      visibly marked with the number 4. This card represents logical channel CH4.
  Measure:
    visual_description: >-
      Locate the measurement entry button on the current DHO804 screen. In the
      waveform view it is a single button labeled 测量 near the upper-right
      RUN/STOP controls. It may not display the English word Measure. Return
      the button itself even when the measurement panel is not open; do not
      require an expanded menu or panel to be visible.
  Vertical:
    visual_description: >-
      Locate the Vertical category/tab inside the measurement panel. In the
      Chinese DHO804 interface it is labeled 垂直. Return a box covering the
      tab label and its horizontal underline together. The currently selected
      tab has a bright horizontal underline beneath the label; an unselected
      tab does not have that underline. Do not require the English word
      Vertical.
  Maximum:
    visual_description: >-
      Locate the Maximum measurement item inside the Vertical measurement panel.
      In the Chinese DHO804 interface it is labeled 最大值. The selected item is
      visually lighter or highlighted compared with neighboring measurement
      items, and the adjacent measurement status area indicates whether it is
      enabled. Do not require the English word Maximum.
